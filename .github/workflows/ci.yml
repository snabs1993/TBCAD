name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Main: one run at a time plus at most one pending run (a newer push replaces the pending one, the
# running one is never cancelled), so a burst of merges cannot pile up dozens of runs on the hosted
# runners. Pull requests cancel their own older runs.
concurrency:
  group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: windows-2022 (MSVC)
    # Not on pull requests: threads merge without waiting, tools/wincheck.sh gives an MSVC result
    # before a merge, and this job runs on every push to main.
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
      - name: Configure
        run: cmake --preset windows-msvc-release -DTBCAD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Test
        run: ctest --preset windows-msvc-release --output-on-failure
      - name: Upload tbcad.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tbcad-windows-release
          path: build/windows-msvc-release/**/tbcad.exe
          if-no-files-found: ignore

  linux:
    name: ubuntu-24.04 (clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        # libegl1 + Mesa give the render tests a software OpenGL context (llvmpipe, no GPU).
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang qpdf libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake --preset linux-clang-debug -DTBCAD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-clang-debug
      - name: Test
        env:
          TBCAD_REQUIRE_GL: "1"  # a missing GL context fails instead of skipping the GL smoke tests
          TBCAD_REQUIRE_QPDF: '1'
        run: ctest --preset linux-clang-debug

  linux-app:
    name: ubuntu-24.04 (clang, tbcad window + smoke test under Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        # X11 headers for GLFW; Xvfb and Mesa (llvmpipe) give the smoke test a display and OpenGL 3.3.
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build clang xvfb
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
          libxkbcommon-dev libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake --preset linux-clang-debug -DTBCAD_BUILD_APP=ON -DTBCAD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-clang-debug
      - name: Test (window smoke test needs a display)
        env:
          TBCAD_REQUIRE_GL: "1"
          TBCAD_REQUIRE_GUI: "1"  # a missing display or OpenGL 3.3 fails the window smoke test
        run: xvfb-run -a -s "-screen 0 1600x1000x24" ctest --preset linux-clang-debug

  linux-sanitizers:
    name: ubuntu-24.04 (clang, ASan + UBSan)
    # Slowest Linux job; runs on main, not on every pull request push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake --preset linux-clang-asan -DTBCAD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-clang-asan
      - name: Test (includes fuzz targets)
        run: ctest --preset linux-clang-asan

  perf:
    name: ubuntu-24.04 (GCC release, performance numbers)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        # Mesa (llvmpipe) gives render_bench a software OpenGL context; its numbers say little about a GPU.
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Configure
        run: cmake --preset linux-gcc-release -DTBCAD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-gcc-release --target tbcad_index_tests render_bench tbcad-convert
      - name: Index numbers (1 M boxes; informational, shared runners are noisy)
        continue-on-error: true
        run: |
          build/linux-gcc-release/libs/index/tbcad_index_tests -tc="bulk load*" | tee index-perf.txt
          { echo '### Spatial index'; echo '```'; grep 'index perf' index-perf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Large file (100 MB DXF in, .tbcad out and back; fails above 60 s each way)
        run: |
          python3 tools/gen_big_dxf.py big.dxf 100
          s=$(date +%s.%N)
          build/linux-gcc-release/apps/tbcad-convert/tbcad-convert -q big.dxf -o big.tbcad
          m=$(date +%s.%N)
          build/linux-gcc-release/apps/tbcad-convert/tbcad-convert -q big.tbcad -o back.dxf
          e=$(date +%s.%N)
          imp=$(echo "$m - $s" | bc -l); exp=$(echo "$e - $m" | bc -l)
          { echo '### 100 MB DXF'; echo "import $imp s, export $exp s"; } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(echo "$imp < 60 && $exp < 60" | bc -l)" = 1
      - name: Render benchmark (software OpenGL, numbers only)
        continue-on-error: true
        run: |
          build/linux-gcc-release/libs/render/render_bench --lines 200000 --frames 60 --size 1280x720 | tee render-bench.txt
          { echo '### Render benchmark (llvmpipe, 200,000 lines)'; echo '```'; cat render-bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: tools/check_format.sh

  license:
    name: license notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Every dependency has a notice file
        run: tools/check_notices.sh
