name: Fuzz file readers, MCP server and formulas

# 30 s on every pull request that touches the DXF code, 5 min every night.
on:
  pull_request:
    paths:
      - "libs/dxf/**"
      - "libs/io/**"
      - "libs/blocks/**"
      - "libs/mcp/**"
      - "libs/font/**"
      - "libs/underlay/**"
      - "libs/plotstyle/**"
      - "libs/expr/**"
      - "libs/hatch/**"
      - "tests/corpus/**"
      - ".github/workflows/fuzz-dxf.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-dxf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer (clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-18-dev
      - name: Configure
        run: >
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTBCAD_DXF_FUZZ=ON -DTBCAD_IO_FUZZ=ON -DTBCAD_MCP_FUZZ=ON -DTBCAD_FORMATS_FUZZ=ON -DTBCAD_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build/fuzz --target tbcad_dxf_fuzz_lexer tbcad_dxf_fuzz_reader tbcad_io_fuzz_tbcad tbcad_mcp_fuzz
          tbcad_font_fuzz_stroke tbcad_underlay_fuzz_pdf tbcad_plotstyle_fuzz_ctb tbcad_expr_fuzz
          tbcad_hatch_fuzz_patterns
      - name: Fuzz
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=300; else seconds=30; fi
          mkdir -p build/fuzz-corpus artifacts
          cp tests/corpus/synthetic/lexer/*.dxf build/fuzz-corpus/
          build/fuzz/libs/dxf/tbcad_dxf_fuzz_lexer build/fuzz-corpus \
            -max_total_time=$seconds -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=artifacts/
      - name: Fuzz the reader
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=300; else seconds=30; fi
          mkdir -p build/fuzz-corpus-reader artifacts
          cp tests/corpus/reader/*.dxf build/fuzz-corpus-reader/
          build/fuzz/libs/dxf/tbcad_dxf_fuzz_reader build/fuzz-corpus-reader \
            -max_total_time=$seconds -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=artifacts/
      - name: Fuzz the .tbcad reader
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=300; else seconds=30; fi
          mkdir -p build/fuzz-corpus-tbcad artifacts
          cp samples/*.tbcad build/fuzz-corpus-tbcad/
          build/fuzz/libs/io/tbcad_io_fuzz_tbcad build/fuzz-corpus-tbcad \
            -max_total_time=$seconds -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=artifacts/
      - name: Fuzz the MCP server
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=300; else seconds=30; fi
          mkdir -p build/fuzz-corpus-mcp artifacts
          cp libs/mcp/tests/fuzz_seeds/*.jsonl build/fuzz-corpus-mcp/
          build/fuzz/libs/mcp/tbcad_mcp_fuzz build/fuzz-corpus-mcp \
            -max_total_time=$seconds -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=artifacts/
      - name: Fuzz fonts, PDF underlays, plot styles, formulas and hatch patterns
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then seconds=120; else seconds=15; fi
          mkdir -p artifacts
          for t in font/tbcad_font_fuzz_stroke:stroke underlay/tbcad_underlay_fuzz_pdf:pdf \
                   plotstyle/tbcad_plotstyle_fuzz_ctb:ctb expr/tbcad_expr_fuzz:expr \
                   hatch/tbcad_hatch_fuzz_patterns:patterns; do
            mkdir -p "build/fuzz-corpus-${t#*:}"
            cp tests/corpus/fuzz/${t#*:}/* "build/fuzz-corpus-${t#*:}/"
            build/fuzz/libs/${t%:*} "build/fuzz-corpus-${t#*:}" \
              -max_total_time=$seconds -timeout=10 -rss_limit_mb=2048 \
              -artifact_prefix=artifacts/
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dxf-fuzz-crashes
          path: artifacts/
          if-no-files-found: ignore
